[project]
name = "token-counter"
version = "0.2.0"
description = "Count tokens using tiktoken"
authors = [{ name = "Michelle Welcks" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4"
keywords = ["tokens", "tiktoken", "openai"]
dependencies = ["tiktoken>=0.6,<1.0"]

[project.urls]
Repository = "https://github.com/binarysubstrate/token-counter"

[project.scripts]
count-tokens = "token_counter.count_tokens:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "token_counter" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
flake8 = "^7.0"

[tool.pytest.ini_options]
testpaths = ["token_counter"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
